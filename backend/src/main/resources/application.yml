# Identifica a aplicação no contexto do Spring Boot.
spring:
  application:
    name: campus-market-backend
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# A variável de ambiente SERVER_PORT permite alterar a porta.
# Quando ela não estiver definida, o servidor utilizará a porta 8080.
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never

campus:
  uploads: ${CAMPUS_UPLOADS:./data/uploads}

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:./data/campusmarket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusmarket}
    username: ${DB_USER:campusmarket}
    password: ${DB_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
